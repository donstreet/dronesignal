 
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dronesignal.zip'
      - '.github/workflows/build-apk.yml'
      - 'app-redesign/**'
      - 'tools/refactor_app.py'
  pull_request:
    paths:
      - 'dronesignal.zip'
      - '.github/workflows/build-apk.yml'
      - 'app-redesign/**'
      - 'tools/refactor_app.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q dronesignal.zip -d extracted
          PROJECT="$(find extracted -name settings.gradle.kts -printf '%h\n' -quit)"
          test -n "$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Preserve original Kotlin source for safe refactoring
        uses: actions/upload-artifact@v4
        with:
          name: dronesignal-original-source
          path: extracted/**
          if-no-files-found: error

      - name: Fix Kotlin compilation error
        run: |
          sed -i 's/mp\.setDataSource(url,headers)/mp.setDataSource(url)/g' "$PROJECT_DIR/app/src/main/java/com/example/dronesignal/App.kt"

      - name: Apply safe radio removal and utilities UI when starting from the legacy archive
        shell: bash
        run: |
          APP="$PROJECT_DIR/app/src/main/java/com/example/dronesignal/App.kt"
          if grep -q 'data class Station(' "$APP"; then
            python3 tools/refactor_app.py "$PROJECT_DIR"
          else
            test -f "$PROJECT_DIR/app/src/main/java/com/example/dronesignal/UtilitiesScreens.kt"
            test -f "$PROJECT_DIR/app/src/main/java/com/example/dronesignal/AlertVoiceService.kt"
            grep -q 'fun NewAppScreen' "$PROJECT_DIR/app/src/main/java/com/example/dronesignal/UtilitiesScreens.kt"
            echo "Archive already contains the refactored app; skipping one-time refactor."
          fi

      - name: Package refactored source
        run: |
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/dronesignal-refactored-project.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: dronesignal-refactored-source
          path: dronesignal-refactored-project.zip
          if-no-files-found: error

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Update repository ZIP only after a successful APK build
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/utilities-refactor'
        run: |
          cp "$GITHUB_WORKSPACE/dronesignal-refactored-project.zip" "$GITHUB_WORKSPACE/dronesignal.zip"
          if ! git diff --quiet -- dronesignal.zip; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dronesignal.zip
            git commit -m "Update dronesignal.zip with reviewed app redesign and News section"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dronesignal-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
