 
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dronesignal.zip'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'dronesignal.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q dronesignal.zip -d extracted
          PROJECT="$(find extracted -name settings.gradle.kts -printf '%h\n' -quit)"
          test -n "$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Preserve original Kotlin source for safe refactoring
        uses: actions/upload-artifact@v4
        with:
          name: dronesignal-original-source
          path: extracted/**
          if-no-files-found: error

      - name: Fix Kotlin compilation error
        run: |
          sed -i 's/mp\.setDataSource(url,headers)/mp.setDataSource(url)/g' "$PROJECT_DIR/app/src/main/java/com/example/dronesignal/App.kt"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dronesignal-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
