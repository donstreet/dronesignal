
      - name: Fix Kotlin compilation error
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          app = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/example/dronesignal/App.kt"
          code = app.read_text(encoding="utf-8")
          old = "mp.setDataSource(url,headers)"
          assert code.count(old) == 1, "Expected MediaPlayer call not found"
          app.write_text(code.replace(old, "mp.setDataSource(url)"), encoding="utf-8")
          print("App.kt patched successfully")
          PY
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dronesignal.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

    

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q dronesignal.zip -d extracted
          PROJECT="$(find extracted -name settings.gradle.kts -printf '%h\n' -quit)"
          if [ -z "$PROJECT" ]; then
            PROJECT="$(find extracted -name settings.gradle -printf '%h\n' -quit)"
          fi
          test -n "$PROJECT" || exit 1
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dronesignal-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
