name: Build Moi Gorod
on:
  push:
    branches: [clean-rebuild]
    paths:
      - 'new-app/**'
      - '.github/workflows/build-moi-gorod.yml'
  workflow_dispatch:
jobs:
  ingestion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test content classifier and Telegram preview parser
        working-directory: new-app/ingestion
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee ingestion-tests.log
        env:
          PYTHONUNBUFFERED: '1'
      - name: Upload ingestion test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-log
          path: new-app/ingestion/ingestion-tests.log
          if-no-files-found: warn
  apk:
    needs: ingestion-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: new-app
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK exists and is nonempty
        run: test -s new-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Moi-Gorod-debug-apk
          path: new-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
