name: Build Moi Gorod
on:
  push:
    branches: [clean-rebuild]
    paths:
      - 'new-app/**'
      - '.github/workflows/build-moi-gorod.yml'
  workflow_dispatch:
jobs:
  ingestion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        working-directory: new-app/ingestion
        run: python -m compileall -q .
      - name: Test content classifier and Telegram preview parser
        working-directory: new-app/ingestion
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee ingestion-tests.log
        env:
          PYTHONUNBUFFERED: '1'
      - name: Upload ingestion test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-log
          path: new-app/ingestion/ingestion-tests.log
          if-no-files-found: warn
  apk:
    # Android builds independently: ingestion test failures must not suppress APK diagnostics.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -x "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/16.0/bin/sdkmanager"
      - name: Install required Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: new-app
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee android-build.log
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: new-app/android-build.log
          if-no-files-found: warn
      - name: Verify APK exists and is nonempty
        run: test -s new-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Generate APK SHA-256 checksum
        run: cd new-app/app/build/outputs/apk/debug && sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Moi-Gorod-debug-apk
          path: |
            new-app/app/build/outputs/apk/debug/app-debug.apk
            new-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
