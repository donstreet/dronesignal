name: Build DNR Signal v2
on:
  push:
    paths:
      - 'DNR-Signal-v2-source.zip'
      - '.github/workflows/build-v2.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract v2 source
        run: |
          test -f DNR-Signal-v2-source.zip || { echo 'Missing DNR-Signal-v2-source.zip'; exit 1; }
          mkdir -p v2
          unzip -q DNR-Signal-v2-source.zip -d v2
          test -f v2/settings.gradle.kts
          test -f v2/app/src/main/java/com/example/dronesignal/UtilitiesScreens.kt
          test -f v2/app/src/main/java/com/example/dronesignal/App.kt
          echo 'Verified DNR Signal v2 source files'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is not set or does not exist"
            env | grep -E 'ANDROID_(HOME|SDK_ROOT)' || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found; checking preinstalled packages"
            test -d "$SDK_ROOT/platforms/android-35" || { echo "::error::Android platform 35 is missing and sdkmanager was not found"; exit 1; }
            test -d "$SDK_ROOT/build-tools/35.0.0" || { echo "::error::Android Build Tools 35.0.0 are missing and sdkmanager was not found"; exit 1; }
          fi
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"
          echo "Android SDK packages ready"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build v2 APK
        working-directory: v2
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DNR-Signal-v2
          path: v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
