name: Inspect archived Android source

on:
  push:
    paths:
      - '.github/workflows/inspect-archive.yml'
      - 'dronesignal.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and print App.kt for source editing
        shell: bash
        run: |
          mkdir extracted
          unzip -q dronesignal.zip -d extracted
          APP="$(find extracted -path '*/app/src/main/java/com/example/dronesignal/App.kt' -print -quit)"
          test -n "$APP"
          echo '--- APP_KT_BEGIN ---'
          cat "$APP"
          echo '--- APP_KT_END ---'
